<body id="top">

<header>
  <div class="logo">Video<span>Lokal.</span></div>
  <input
    class="search"
    id="search"
    type="search"
    placeholder="Cari video..."
    aria-label="Cari video"
  >
</header>

<div class="categories" aria-label="Kategori video">
  <button class="active" data-cat="Semua">Semua</button>
  <button data-cat="Trending">Trending</button>
  <button data-cat="Lokal">Video Lokal</button>
</div>

<h3 id="heading">🔥 Video Viral Terbaru</h3>

<div class="shopee-promo">
  <p>Temukan produk pilihan di Shopee</p>
  <a
    href="https://s.shopee.co.id/gQufsrGNE"
    target="_blank"
    rel="nofollow sponsored noopener noreferrer"
  >Lihat Produk ⏭️</a>
</div>

<main id="videos"></main>

<nav>
  <a href="#top" class="active">⌂<br>Home</a>
  <a href="#videos" data-filter="Trending">🔥<br>Trending</a>
  <a href="#videos" data-filter="Semua">▶<br>Video</a>
  <a href="#videos" data-favorites="true">♡<br>Favorit</a>
</nav>

<script>
  // Ganti URL contoh dengan video milik sendiri atau
  // video yang memiliki izin untuk dipublikasikan.
  const data = [
    {
      title: "Video Viral Terbaru",
      cat: "Trending",
      views: "Video pilihan",
      url: "GANTI_DENGAN_URL_VIDEO_MP4",
      poster: ""
    },
    {
      title: "Video Lokal Pilihan",
      cat: "Lokal",
      views: "Video pilihan",
      url: "GANTI_DENGAN_URL_VIDEO_MP4",
      poster: ""
    },
    {
      title: "Video Trending",
      cat: "Trending",
      views: "Video pilihan",
      url: "GANTI_DENGAN_URL_VIDEO_MP4",
      poster: ""
    }
  ];

  let category = "Semua";
  let favoritesOnly = false;

  const favorites = new Set();
  const videos = document.getElementById("videos");
  const search = document.getElementById("search");
  const heading = document.getElementById("heading");

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }

  function stopVideos() {
    videos.querySelectorAll("video").forEach(video => {
      video.pause();
    });
  }

  function render() {
    const query = search.value.toLowerCase().trim();

    const list = data
      .map((video, index) => ({ ...video, index }))
      .filter(video =>
        (category === "Semua" || video.cat === category) &&
        (video.title + " " + video.cat).toLowerCase().includes(query) &&
        (!favoritesOnly || favorites.has(video.index))
      );

    if (!list.length) {
      videos.innerHTML =
        '<div class="empty">Video tidak ditemukan.</div>';
      return;
    }

    videos.innerHTML = list.map(video => {
      const validVideo =
        /^https?:\/\//i.test(video.url) &&
        !video.url.includes("GANTI_DENGAN_URL");

      const validPoster =
        /^https?:\/\//i.test(video.poster);

      return `
        <article class="video">
          <div class="cover">
            <video
              ${validVideo
                ? `src="${escapeHTML(video.url)}"`
                : ""}
              ${validPoster
                ? `poster="${escapeHTML(video.poster)}"`
                : ""}
              controls
              playsinline
              preload="metadata"
              data-index="${video.index}"
              aria-label="${escapeHTML(video.title)}"
            >
              Browser Anda tidak mendukung video HTML5.
            </video>

            <button
              class="play"
              type="button"
              data-action="play"
              data-index="${video.index}"
              aria-label="Putar video"
            >▶</button>

            ${!validVideo
              ? '<div class="video-error">Tambahkan URL MP4 yang valid.</div>'
              : ""}
          </div>

          <div class="info">
            <h4>${escapeHTML(video.title)}</h4>
            <p>${escapeHTML(video.cat)} · ${escapeHTML(video.views)}</p>

            <div class="actions">
              <button
                type="button"
                data-action="like"
                data-index="${video.index}"
                class="${favorites.has(video.index) ? "liked" : ""}"
              >${favorites.has(video.index) ? "♥ Favorit" : "♡ Favorit"}</button>

              <button
                type="button"
                data-action="share"
                data-index="${video.index}"
              >↗ Bagikan</button>
            </div>
          </div>
        </article>
      `;
    }).join("");
  }

  // Satu video diputar pada satu waktu.
  videos.addEventListener("play", event => {
    const current = event.target;

    if (!(current instanceof HTMLVideoElement)) return;

    videos.querySelectorAll("video").forEach(video => {
      if (video !== current) video.pause();
    });
  }, true);

  videos.addEventListener("playing", event => {
    const video = event.target;

    if (!(video instanceof HTMLVideoElement)) return;

    const button = video.closest(".cover")?.querySelector(".play");
    if (button) button.classList.add("hidden");
  });

  videos.addEventListener("pause", event => {
    const video = event.target;

    if (!(video instanceof HTMLVideoElement)) return;

    const button = video.closest(".cover")?.querySelector(".play");
    if (button) button.classList.remove("hidden");
  });

  videos.addEventListener("ended", event => {
    const video = event.target;

    if (!(video instanceof HTMLVideoElement)) return;

    const button = video.closest(".cover")?.querySelector(".play");
    if (button) button.classList.remove("hidden");
  });

  videos.addEventListener("error", event => {
    const video = event.target;

    if (!(video instanceof HTMLVideoElement)) return;

    const cover = video.closest(".cover");
    if (!cover) return;

    let message = cover.querySelector(".video-error");

    if (!message) {
      message = document.createElement("div");
      message.className = "video-error";
      cover.appendChild(message);
    }

    message.textContent =
      "Video gagal dimuat. Periksa URL dan format MP4.";
  }, true);

  videos.addEventListener("click", async event => {
    const button = event.target.closest("button[data-action]");
    if (!button) return;

    const index = Number(button.dataset.index);
    const action = button.dataset.action;
    const video = data[index];

    if (!video) return;

    if (action === "play") {
      const player = videos.querySelector(
        `video[data-index="${index}"]`
      );

      if (!player || !player.hasAttribute("src")) {
        alert("Tambahkan URL video MP4 terlebih dahulu.");
        return;
      }

      if (player.paused) {
        try {
          await player.play();
        } catch (error) {
          alert("Video tidak dapat diputar. Periksa URL MP4.");
        }
      } else {
        player.pause();
      }

      return;
    }

    if (action === "like") {
      if (favorites.has(index)) {
        favorites.delete(index);
      } else {
        favorites.add(index);
      }

      render();
      return;
    }

    if (action === "share") {
      const shareURL = /^https?:\/\//i.test(video.url)
        ? video.url
        : window.location.href;

      try {
        if (navigator.share) {
          await navigator.share({
            title: video.title,
            url: shareURL
          });
        } else if (
          navigator.clipboard &&
          window.isSecureContext
        ) {
          await navigator.clipboard.writeText(shareURL);
          alert("Link berhasil disalin.");
        } else {
          window.prompt("Salin link:", shareURL);
        }
      } catch (error) {
        if (error.name !== "AbortError") {
          window.prompt("Salin link:", shareURL);
        }
      }
    }
  });

  function setCategory(value) {
    stopVideos();
    category = value;
    favoritesOnly = false;

    document.querySelectorAll(".categories button").forEach(button => {
      button.classList.toggle("active", button.dataset.cat === value);
    });

    heading.textContent = value === "Semua"
      ? "🔥 Video Viral Terbaru"
      : "🔥 Video " + value;

    render();
  }

  document.querySelector(".categories").addEventListener("click", event => {
    const button = event.target.closest("button[data-cat]");
    if (button) setCategory(button.dataset.cat);
  });

  document.querySelector("nav").addEventListener("click", event => {
    const link = event.target.closest("a");
    if (!link) return;

    if (link.dataset.filter) {
      event.preventDefault();
      setCategory(link.dataset.filter);
    }

    if (link.dataset.favorites) {
      event.preventDefault();
      stopVideos();
      category = "Semua";
      favoritesOnly = true;

      document.querySelectorAll(".categories button").forEach(button => {
        button.classList.toggle(
          "active",
          button.dataset.cat === "Semua"
        );
      });

      heading.textContent = "♡ Video Favorit";
      render();
    }
  });

  search.addEventListener("input", () => {
    stopVideos();
    render();
  });

  render();
</script>

</body>
</html>
