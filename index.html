
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videy Video Player</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
    }

    h2 {
      text-align: center;
    }

    .video-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 6px;
      font-size: 16px;
    }

    input {
      border: 1px solid #444;
      background: #222;
      color: white;
    }

    button {
      border: none;
      background: #e50914;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Videy Video Player</h2>

    <div class="video-box">
      <iframe
        id="videoPlayer"
        src="about:blank"
        allowfullscreen
        allow="autoplay; fullscreen; picture-in-picture">
      </iframe>
    </div>

    <button onclick="playVideo()">
      Putar Video
    </button>
  </div>

  <script>
    function playVideo() {
      const url = document.getElementById("videoUrl").value.trim();

      try {
        const parsed = new URL(url);

        if (!["https:", "http:"].includes(parsed.protocol)) {
          throw new Error("URL tidak valid");
        }

        document.getElementById("videoPlayer").src = parsed.href;
      } catch {
        alert("Masukkan URL video yang valid.");
      }
    }
  </script>
</body>
</html>
