
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #111827;
      color: #f9fafb;
    }

    header, main, footer {
      max-width: 800px;
      margin: 0 auto;
    }

    header h1 {
      text-align: center;
    }

    .player {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .placeholder {
      padding: 20px;
      text-align: center;
      color: #d1d5db;
    }

    .url-box {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    input[type="url"] {
      flex: 1;
      min-width: 200px;
      padding: 12px;
      border: 1px solid #4b5563;
      border-radius: 6px;
      background: #1f2937;
      color: white;
    }

    button, .file-button {
      padding: 12px 16px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover, .file-button:hover {
      background: #1d4ed8;
    }

    .file-area {
      margin-bottom: 16px;
      text-align: center;
    }

    .note {
      color: #9ca3af;
      font-size: 14px;
      line-height: 1.6;
    }

    footer {
      margin-top: 30px;
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <header>
    <h1>Video Player</h1>

    <div class="file-area">
      <label for="fileInput" class="file-button">
        Pilih Video dari Perangkat
      </label>

      <input
        type="file"
        id="fileInput"
        accept="video/*,.mp4,.m4v,.webm,.ogv,.mov"
        hidden
      >
    </div>
  </header>

  <main>
    <div class="player" id="playerBox">
      <div class="placeholder" id="placeholder">
        Pilih video atau masukkan URL video untuk mulai memutar.
      </div>

      <video
        id="videoPlayer"
        controls
        playsinline
        preload="metadata"
        hidden
      >
        Browser kamu tidak mendukung pemutar video HTML5.
      </video>
    </div>

    <div class="url-box">
      <input
        type="url"
        id="videoUrl"
        placeholder="Masukkan URL video langsung..."
        autocomplete="url"
      >

      <button type="button" id="playButton">
        Putar Video
      </button>
    </div>

    <p class="note">
      Pilih video dari perangkat atau masukkan URL video langsung
      yang dapat diakses dan didukung oleh browser.
    </p>
  </main>

  <footer>
    Video Player · 2026
  </footer>

  <script>
    const video = document.getElementById("videoPlayer");
    const placeholder = document.getElementById("placeholder");
    const fileInput = document.getElementById("fileInput");
    const videoUrl = document.getElementById("videoUrl");
    const playButton = document.getElementById("playButton");

    let localVideoUrl = null;

    function showPlayer() {
      video.hidden = false;
      placeholder.hidden = true;
    }

    function showMessage(message) {
      video.hidden = true;
      placeholder.textContent = message;
      placeholder.hidden = false;
    }

    function releaseLocalUrl() {
      if (localVideoUrl) {
        URL.revokeObjectURL(localVideoUrl);
        localVideoUrl = null;
      }
    }

    function loadVideo(url, isLocal = false) {
      video.pause();

      if (!isLocal) {
        releaseLocalUrl();
      }

      video.src = url;
      showPlayer();
      video.load();

      video.play().catch(() => {
        // Autoplay dapat diblokir oleh browser.
        // Pengguna tetap bisa menekan tombol Play.
      });
    }

    fileInput.addEventListener("change", function () {
      const file = this.files && this.files[0];

      if (!file) return;

      if (!file.type.startsWith("video/") &&
          !/\.(mp4|m4v|webm|ogv|mov)$/i.test(file.name)) {
        showMessage("File yang dipilih bukan file video.");
        return;
      }

      releaseLocalUrl();

      localVideoUrl = URL.createObjectURL(file);
      loadVideo(localVideoUrl, true);
    });

    function playUrl() {
      const value = videoUrl.value.trim();

      if (!value) {
        alert("Silakan masukkan URL video terlebih dahulu.");
        videoUrl.focus();
        return;
      }

      try {
        const url = new URL(value);

        if (!["http:", "https:"].includes(url.protocol)) {
          throw new Error("Protokol URL tidak didukung.");
        }

        loadVideo(url.href);
      } catch {
        alert("Masukkan URL video HTTP atau HTTPS yang valid.");
      }
    }

    playButton.addEventListener("click", playUrl);

    videoUrl.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        playUrl();
      }
    });

    video.addEventListener("error", function () {
      showMessage(
        "Video tidak dapat diputar. Periksa URL, format video, " +
        "akses server, atau dukungan browser."
      );
    });

    window.addEventListener("beforeunload", releaseLocalUrl);
  </script>
</body>
</html>
