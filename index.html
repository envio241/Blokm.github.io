
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ViralNow - Video Viral</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#101010;
  color:white;
  font-family:Arial,sans-serif;
  padding-bottom:75px
}

header{
  padding:17px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#181818;
  position:sticky;
  top:0;
  z-index:5
}

.logo{
  font-size:23px;
  font-weight:bold;
  color:#ff3040
}
.logo span{color:white}

.search{
  background:#292929;
  color:white;
  border:0;
  border-radius:20px;
  padding:10px;
  width:115px;
  outline:none
}

.categories{
  display:flex;
  gap:10px;
  padding:15px;
  overflow-x:auto
}

.categories button{
  border:0;
  border-radius:20px;
  padding:9px 16px;
  background:#292929;
  color:white;
  white-space:nowrap;
  cursor:pointer
}

.categories button.active{background:#ff3040}

h3{margin:5px 15px 15px}

.video{
  margin:0 12px 22px;
  background:#1c1c1c;
  border-radius:13px;
  overflow:hidden
}

.cover{
  position:relative;
  background:#292929;
  overflow:hidden;
  min-height:180px
}

.cover video{
  width:100%;
  display:block;
  max-height:480px;
  object-fit:cover;
  aspect-ratio:9/12;
  cursor:pointer
}

.play{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:65px;
  height:65px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  color:white;
  background:#0009;
  border:2px solid #ffffff80;
  border-radius:50%;
  cursor:pointer;
  z-index:2
}

.play.hidden{display:none}

.placeholder{
  aspect-ratio:9/12;
  max-height:480px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa;
  text-align:center;
  padding:20px
}

.info{padding:12px}

.info h4{
  margin:0 0 8px;
  font-size:16px
}

.info p{
  margin:0;
  color:#aaa;
  font-size:12px
}

.actions{
  display:flex;
  justify-content:space-between;
  padding-top:12px;
  color:#ddd
}

.actions button{
  background:none;
  border:0;
  color:white;
  font-size:14px;
  cursor:pointer
}

.actions button.liked{color:#ff3040}

nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#181818;
  display:flex;
  justify-content:space-around;
  padding:13px 5px;
  z-index:10;
  border-top:1px solid #333
}

nav a{
  color:#bbb;
  text-decoration:none;
  font-size:12px;
  text-align:center
}

nav a:first-child{color:#ff3040}

.empty{
  padding:30px;
  text-align:center;
  color:#aaa
}
</style>
</head>

<body id="top">

<header>
  <div class="logo">Viral<span>Now.</span></div>
  <input
    class="search"
    id="search"
    placeholder="Cari video..."
    aria-label="Cari video"
  >
</header>

<div class="categories">
  <button class="active" data-cat="Semua">🔥 Semua</button>
  <button data-cat="Trending">Trending</button>
  <button data-cat="Lucu">😂 Lucu</button>
  <button data-cat="Musik">🎵 Musik</button>
  <button data-cat="Gaming">🎮 Gaming</button>
</div>

<h3>🔥 Video Viral Hari Ini</h3>
<main id="videos"></main>

<nav>
  <a href="#top">⌂<br>Home</a>
  <a href="#videos" data-filter="Trending">🔥<br>Trending</a>
  <a href="#videos" data-filter="Semua">▶<br>Video</a>
  <a href="#videos" data-favorites="true">♡<br>Favorit</a>
</nav>

<script>
// GANTI URL VIDEO DAN THUMBNAIL DENGAN MILIKMU
const data = [
  {
    title:"Video Viral Terbaru 🔥",
    cat:"Trending",
    views:"12,5 rb",
    url:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
    poster:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=720"
  },
  {
    title:"Video Lucu Bikin Ngakak 😂",
    cat:"Lucu",
    views:"8,2 rb",
    url:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
    poster:"https://images.unsplash.com/photo-1533738363-b7f9aef128ce?w=720"
  },
  {
    title:"Musik Populer Minggu Ini 🎵",
    cat:"Musik",
    views:"5,1 rb",
    url:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
    poster:"https://images.unsplash.com/photo-1516280440614-37939bbacd81?w=720"
  },
  {
    title:"Momen Gaming Seru 🎮",
    cat:"Gaming",
    views:"3,7 rb",
    url:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
    poster:"https://images.unsplash.com/photo-1542751371-adc38448a05e?w=720"
  }
];

let category = "Semua";
let favoritesOnly = false;
const favorites = new Set();

const videos = document.getElementById("videos");
const search = document.getElementById("search");

// Mencegah teks dari data ditafsirkan sebagai HTML.
function escapeHTML(value){
  return String(value).replace(/[&<>"']/g, ch => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[ch]);
}

function render(){
  const q = search.value.toLowerCase().trim();

  const list = data
    .map((v,index)=>({...v,index}))
    .filter(v =>
      (category === "Semua" || v.cat === category) &&
      v.title.toLowerCase().includes(q) &&
      (!favoritesOnly || favorites.has(v.index))
    );

  if(!list.length){
    videos.innerHTML =
      '<div class="empty">Video tidak ditemukan.</div>';
    return;
  }

  videos.innerHTML = list.map(v => `
    <article class="video">
      <div class="cover">
        ${
          v.url
          ? `
            <video
              controls
              playsinline
              preload="none"
              poster="${escapeHTML(v.poster)}"
              data-index="${v.index}"
              aria-label="${escapeHTML(v.title)}">
              Browser kamu tidak mendukung video HTML5.
            </video>
            <button
              class="play"
              data-action="play"
              data-index="${v.index}"
              aria-label="Putar video">▶</button>
          `
          : `
            <div class="placeholder">
              Video belum tersedia
            </div>
          `
        }
      </div>

      <div class="info">
        <h4>${escapeHTML(v.title)}</h4>
        <p>${escapeHTML(v.cat)} · ${escapeHTML(v.views)} tayangan</p>

        <div class="actions">
          <button
            data-action="like"
            data-index="${v.index}"
            class="${favorites.has(v.index) ? "liked" : ""}">
            ${favorites.has(v.index) ? "♥ Disukai" : "♡ Suka"}
          </button>

          <button
            data-action="share"
            data-index="${v.index}">
            ↗ Bagikan
          </button>
        </div>
      </div>
    </article>
  `).join("");
}

// Memutar video dan menghentikan video lainnya.
videos.addEventListener("play", event => {
  const current = event.target;

  if(current.tagName !== "VIDEO") return;

  document.querySelectorAll("#videos video").forEach(video => {
    if(video !== current) video.pause();
  });
});

// Sembunyikan tombol play saat video berjalan.
videos.addEventListener("playing", event => {
  const video = event.target;
  if(video.tagName !== "VIDEO") return;

  const button = videos.querySelector(
    `.play[data-index="${video.dataset.index}"]`
  );

  if(button) button.classList.add("hidden");
});

// Tampilkan kembali tombol play ketika video dijeda.
videos.addEventListener("pause", event => {
  const video = event.target;
  if(video.tagName !== "VIDEO") return;

  const button = videos.querySelector(
    `.play[data-index="${video.dataset.index}"]`
  );

  if(button) button.classList.remove("hidden");
});

// Klik tombol play.
videos.addEventListener("click", event => {
  const button = event.target.closest('[data-action="play"]');
  if(!button) return;

  const video = videos.querySelector(
    `video[data-index="${button.dataset.index}"]`
  );

  if(video){
    video.play().catch(() => {
      alert("Video gagal diputar. Periksa URL video MP4.");
    });
  }
});

// Tombol suka dan bagikan.
videos.addEventListener("click", async event => {
  const button = event.target.closest("[data-action]");
  if(!button) return;

  const index = Number(button.dataset.index);
  const action = button.dataset.action;

  if(action === "like"){
    if(favorites.has(index)){
      favorites.delete(index);
    }else{
      favorites.add(index);
    }
    render();
  }

  if(action === "share"){
    const video = data[index];

    try{
      if(navigator.share){
        await navigator.share({
          title:video.title,
          url:video.url || location.href
        });
      }else{
        await navigator.clipboard.writeText(
          video.url || location.href
        );
        alert("Link berhasil disalin.");
      }
    }catch(error){
      if(error.name !== "AbortError"){
        prompt("Salin link:", video.url || location.href);
      }
    }
  }
});

// Filter kategori.
document.querySelector(".categories").addEventListener("click", event => {
  const button = event.target.closest("button[data-cat]");
  if(!button) return;

  category = button.dataset.cat;
  favoritesOnly = false;

  document.querySelectorAll(".categories button")
    .forEach(b => b.classList.toggle("active", b === button));

  render();
});

// Navigasi bawah.
document.querySelector("nav").addEventListener("click", event => {
  const link = event.target.closest("a");
  if(!link) return;

  if(link.dataset.filter){
    category = link.dataset.filter;
    favoritesOnly = false;

    document.querySelectorAll(".categories button")
      .forEach(b => b.classList.toggle(
        "active", b.dataset.cat === category
      ));

    render();
  }

  if(link.dataset.favorites){
    event.preventDefault();
    favoritesOnly = true;
    category = "Semua";

    document.querySelectorAll(".categories button")
      .forEach(b => b.classList.toggle(
        "active", b.dataset.cat === "Semua"
      ));

    render();
  }
});

// Pencarian.
search.addEventListener("input", render);

render();
</script>

</body>
</html>
