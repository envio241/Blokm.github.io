
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIRALZONE - Video Trending</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: Arial, sans-serif;
  background: #0b0b0f;
  color: white;
}
header {
  padding: 18px 5%;
  background: #15151d;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
  border-bottom: 1px solid #292933;
}
.logo {
  color: #ff3155;
  font-size: 25px;
  font-weight: 900;
}
.search {
  padding: 11px 15px;
  border: 1px solid #383844;
  border-radius: 25px;
  background: #22222c;
  color: white;
  outline: none;
  max-width: 100%;
}
main {
  max-width: 1200px;
  padding: 25px 18px;
  margin: auto;
}
h2 {
  margin-bottom: 18px;
}
.categories {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 20px;
}
.categories button {
  background: #24242e;
  color: white;
  border: 0;
  border-radius: 20px;
  padding: 10px 18px;
  cursor: pointer;
  white-space: nowrap;
}
.categories button.active,
.categories button:hover {
  background: #ff3155;
}
.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 20px;
}
.card {
  background: #17171f;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid #292933;
}
.card video {
  width: 100%;
  aspect-ratio: 16 / 10;
  object-fit: cover;
  display: block;
  background: #222;
}
.info {
  padding: 14px;
}
.info h3 {
  font-size: 16px;
  margin-bottom: 9px;
}
.meta {
  color: #aaaab8;
  font-size: 13px;
}
.play {
  display: block;
  width: 100%;
  margin-top: 13px;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: #ff3155;
  color: white;
  cursor: pointer;
  font-weight: bold;
}
.play:hover {
  background: #df2043;
}
footer {
  text-align: center;
  padding: 30px 15px;
  color: #888;
}
@media (max-width: 750px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 480px) {
  .grid { grid-template-columns: 1fr; }
  header { align-items: stretch; }
  .search { width: 100%; }
}
</style>
</head>
<body>

<header>
  <div class="logo">🔥 VIRALZONE</div>
  <input id="search" class="search"
    type="search" placeholder="Cari video viral...">
</header>

<main>
  <h2>🔥 Video Trending</h2>
  <div class="categories">
    <button class="active" data-category="Semua">Semua</button>
    <button data-category="Hiburan">Hiburan</button>
    <button data-category="Musik">Musik</button>
    <button data-category="Gaming">Gaming</button>
    <button data-category="Lucu">Lucu</button>
  </div>

  <div class="grid" id="videoGrid"></div>
  <p id="empty" style="display:none;color:#aaa;margin-top:20px">
    Video tidak ditemukan.
  </p>
</main>

<footer>
  © 2026 VIRALZONE — Video pilihan komunitas
</footer>

<script>
const videos = [
  {
    title: "Video Hiburan Trending",
    category: "Hiburan",
    views: "Video pilihan",
    url: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
  },
  {
    title: "Momen Alam yang Menakjubkan",
    category: "Musik",
    views: "Video pilihan",
    url: "https://www.w3schools.com/html/mov_bbb.mp4"
  },
  {
    title: "Video Seru Hari Ini",
    category: "Gaming",
    views: "Video pilihan",
    url: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
  },
  {
    title: "Momen Santai dan Lucu",
    category: "Lucu",
    views: "Video pilihan",
    url: "https://www.w3schools.com/html/mov_bbb.mp4"
  }
];

const grid = document.getElementById("videoGrid");
const search = document.getElementById("search");
const empty = document.getElementById("empty");
let category = "Semua";

function render() {
  const keyword = search.value.toLowerCase();

  const filtered = videos.filter(video =>
    (category === "Semua" || video.category === category) &&
    video.title.toLowerCase().includes(keyword)
  );

  grid.innerHTML = filtered.map((video, index) => `
    <article class="card">
      <video controls playsinline preload="none"
        src="${video.url}"
        aria-label="${video.title}"></video>
      <div class="info">
        <h3>${video.title}</h3>
        <div class="meta">
          ${video.category} · ${video.views}
        </div>
        <button class="play" data-index="${index}">
          ▶ Putar Video
        </button>
      </div>
    </article>
  `).join("");

  empty.style.display = filtered.length ? "none" : "block";

  grid.querySelectorAll(".play").forEach(button => {
    button.addEventListener("click", () => {
      const video = button.closest(".card").querySelector("video");
      if (video.paused) {
        video.play().catch(() => {
          alert("Video tidak dapat diputar. Coba lagi.");
        });
      } else {
        video.pause();
      }
    });
  });
}

search.addEventListener("input", render);

document.querySelectorAll(".categories button").forEach(button => {
  button.addEventListener("click", () => {
    category = button.dataset.category;
    document.querySelectorAll(".categories button")
      .forEach(item => item.classList.remove("active"));
    button.classList.add("active");
    render();
  });
});

render();
</script>
</body>
</html>
