<script>
  const upload = document.getElementById("videoUpload");
  const player = document.getElementById("player");
  const placeholder = document.getElementById("placeholder");
  const title = document.getElementById("videoTitle");
  const description = document.getElementById("videoDescription");
  const ageModal = document.getElementById("ageModal");
  const continueButton = document.getElementById("continueButton");

  const defaultVideoURL =
    "https://videotourl.com/videos/1791989161964-e0c6bcb0-8083-44e6-9216-a0e315600056.mp4";

  const shopeeLink =
    "https://s.shopee.co.id/4B0iZUcobL";

  const directLink =
    "https://cleavegrate.com/n48ddaqe2e?key=50475bbbba58881ff9d633fa4ed03766";

  let currentVideoURL = null;

  // Konfirmasi usia dan buka link Shopee
  continueButton.addEventListener("click", function () {
    window.open(shopeeLink, "_blank", "noopener,noreferrer");
    ageModal.classList.add("hidden");
  });

  // Menangani video online bawaan
  player.addEventListener("loadedmetadata", function () {
    if (
      player.currentSrc === defaultVideoURL ||
      player.src === defaultVideoURL
    ) {
      placeholder.classList.add("hidden");
    }
  });

  // Menangani error video
  player.addEventListener("error", function () {
    if (!currentVideoURL) {
      placeholder.classList.remove("hidden");
      placeholder.innerHTML =
        "<p>Video gagal dimuat. Periksa koneksi atau tautan video.</p>";
    }
  });

  // Upload video dari perangkat
  upload.addEventListener("change", function () {
    const file = this.files[0];

    if (!file) return;

    if (!file.type.startsWith("video/")) {
      alert("Silakan pilih file video yang valid.");
      this.value = "";
      return;
    }

    if (currentVideoURL) {
      URL.revokeObjectURL(currentVideoURL);
    }

    currentVideoURL = URL.createObjectURL(file);

    player.pause();
    player.src = currentVideoURL;
    player.load();

    player.classList.remove("hidden");
    placeholder.classList.add("hidden");

    title.textContent = file.name;
    description.textContent =
      "Ukuran file: " +
      (file.size / (1024 * 1024)).toFixed(2) +
      " MB";

    player.play().catch(function () {});
  });

  // Membersihkan URL video lokal
  window.addEventListener("beforeunload", function () {
    if (currentVideoURL) {
      URL.revokeObjectURL(currentVideoURL);
    }
  });
</script>
