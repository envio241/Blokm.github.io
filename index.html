<!DOCTYPE html>

<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

body {
font-family: Arial, sans-serif;
background: #09090f;
color: #fff;
min-height: 100vh;
}

header {
padding: 22px 7%;
display: flex;
justify-content: space-between;
align-items: center;
border-bottom: 1px solid #252532;
}

.logo {
font-size: 25px;
font-weight: bold;
color: #a78bfa;
}

.status {
font-size: 13px;
color: #aaa;
}

main {
max-width: 1050px;
margin: 45px auto;
padding: 0 22px;
}

.intro {
text-align: center;
margin-bottom: 30px;
}

.intro h1 {
font-size: clamp(28px, 5vw, 44px);
margin-bottom: 12px;
}

.intro p {
color: #a1a1b5;
line-height: 1.7;
}

.ad-area {
margin: 22px 0;
padding: 18px;
text-align: center;
background: #12121b;
border: 1px solid #28283a;
border-radius: 12px;
}

.ad-label {
color: #85859b;
font-size: 11px;
margin-bottom: 10px;
text-transform: uppercase;
letter-spacing: 2px;
}

.sponsor-link {
display: inline-block;
padding: 11px 20px;
color: #fff;
background: #49328a;
text-decoration: none;
border-radius: 8px;
font-size: 14px;
}

.sponsor-link:hover {
background: #6245b4;
}

.video-container {
background: #15151f;
padding: 10px;
border: 1px solid #303044;
border-radius: 18px;
box-shadow: 0 20px 70px #0008;
}

video {
display: block;
width: 100%;
aspect-ratio: 16 / 9;
background: #000;
border-radius: 10px;
}

.video-info {
display: flex;
align-items: center;
justify-content: space-between;
flex-wrap: wrap;
gap: 15px;
padding: 22px 5px 10px;
}

.video-info h2 {
font-size: 20px;
margin-bottom: 8px;
}

.video-info p {
color: #a1a1b5;
font-size: 14px;
}

.tag {
background: #29213f;
color: #c4b5fd;
padding: 9px 14px;
border-radius: 20px;
font-size: 12px;
}

.notice {
margin-top: 20px;
background: #12121b;
border: 1px solid #28283a;
border-radius: 12px;
padding: 18px;
color: #aaa;
font-size: 14px;
line-height: 1.7;
}

footer {
text-align: center;
color: #77778b;
padding: 25px 15px;
font-size: 13px;
}

@media (max-width: 600px) {
header {
padding: 18px 20px;
}

main {
margin: 30px auto;
padding: 0 14px;
}

.video-container {
padding: 6px;
border-radius: 12px;
}

.video-info h2 {
font-size: 18px;
}
}
</style>
</head>

<body>
<header>
<div class="logo">TRIBUNVIDEO.</div>
<div class="status">● KUMPULAN VIDEO LOKAL</div>
</header>

<main>
<section class="intro">
<h1>Watch Your Video</h1>
<p>
ENJOY<br>
FOR WACTH
</p>
</section>

<!-- IKLAN SHOPEE -->
<section class="shopee-ad">
  <div class="shopee-label">
    
  </div>

  <h3>ASUPANLOKAL </h3>

  <p>
    TERBARU👇
  </p>

  <a
    class="shopee-button"
    href="https://s.shopee.co.id/113gvbaqc9"
    target="_blank"
    rel="sponsored nofollow noopener noreferrer"
  >
    TONTON DISINI 👈
  </a>

  <small class="shopee-disclaimer">
    
  </small>
</section>

<!-- AREA IKLAN TAMBAHAN -->
<section class="ad-area">

<!-- AREA IKLAN POPUNDER / SPONSOR -->
<section class="ad-area">
<div class="ad-label">TRIBUNVIDEO.</div>
<a
class="sponsor-link"
href="https://cleavegrate.com/n48ddaqe2e?key=50475bbbba58881ff9d633fa4ed03766"
target="_blank"
rel="sponsored nofollow noopener noreferrer"
>
NEXT VIDEO ▶️
</a>
</section>

<!-- PEMUTAR VIDEO -->
<section class="video-container">
<video
id="myVideo"
controls
playsinline
preload="metadata"
>
<source
src="https://videotourl.com/videos/1791992724770-f5ebc618-9375-4a3f-ba87-ea712f93f8dc.mp4"
type="video/mp4"
>
Browser kamu tidak mendukung pemutar video HTML5.
</video>

<div class="video-info">
<div>
<h2></h2>
<p></p>
</div>
<span class="tag">VIDEO</span>
</div>
</section>

<!-- AREA IKLAN TAMBAHAN -->
<section class="ad-area">
<div class="ad-label"></div>
<p style="color:#aaa;font-size:13px">

</p>
</section>

<div class="notice" id="notice">

</div>
</main>

<footer>
© <span id="year"></span> TRIBUNVIDEO
</footer>

<script>
document.getElementById("year").textContent =
new Date().getFullYear();

const video = document.getElementById("myVideo");
const notice = document.getElementById("notice");

video.addEventListener("error", function () {
notice.textContent =
"Video gagal dimuat. Periksa koneksi internet " +
"atau pastikan link video masih aktif.";
});

video.addEventListener("playing", function () {
notice.textContent =
"Video sedang diputar. Selamat menonton!";
});

video.addEventListener("pause", function () {
if (!video.ended && video.currentTime > 0) {
notice.textContent = "Video dijeda.";
}
});

video.addEventListener("ended", function () {
notice.textContent = "Video selesai ditonton.";
});
</script>
