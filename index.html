
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ViralNow - Video Viral</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#101010;color:white;
  font-family:Arial,sans-serif;padding-bottom:75px
}
header{
  padding:17px;display:flex;justify-content:space-between;
  align-items:center;background:#181818;position:sticky;top:0;
  z-index:5
}
.logo{font-size:23px;font-weight:bold;color:#ff3040}
.logo span{color:white}
.search{background:#292929;color:white;border:0;
  border-radius:20px;padding:10px;width:115px}
.categories{display:flex;gap:10px;padding:15px;overflow:auto}
.categories button{
  border:0;border-radius:20px;padding:9px 16px;
  background:#292929;color:white;white-space:nowrap
}
.categories button.active{background:#ff3040}
h3{margin:5px 15px 15px}
.video{
  margin:0 12px 22px;background:#1c1c1c;
  border-radius:13px;overflow:hidden
}
.cover{position:relative;background:#292929}
.cover video{width:100%;display:block;max-height:480px;
  object-fit:cover;aspect-ratio:9/12}
.play{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);font-size:45px;
  background:#0008;border-radius:50%;padding:8px 17px;
  pointer-events:none
}
.info{padding:12px}
.info h4{margin:0 0 8px;font-size:16px}
.info p{margin:0;color:#aaa;font-size:12px}
.actions{display:flex;justify-content:space-between;
  padding-top:12px;color:#ddd}
.actions button{background:none;border:0;color:white;font-size:14px}
nav{
  position:fixed;bottom:0;left:0;right:0;
  background:#181818;display:flex;justify-content:space-around;
  padding:13px 5px;z-index:10;border-top:1px solid #333
}
nav a{color:#bbb;text-decoration:none;font-size:12px;text-align:center}
nav a:first-child{color:#ff3040}
.empty{padding:30px;text-align:center;color:#aaa}
</style>
</head>
<body>

<header>
  <div class="logo">Viral<span>Now.</span></div>
  <input class="search" id="search" placeholder="Cari video...">
</header>

<div class="categories">
  <button class="active" onclick="filter('Semua',this)">🔥 Semua</button>
  <button onclick="filter('Trending',this)">Trending</button>
  <button onclick="filter('Lucu',this)">😂 Lucu</button>
  <button onclick="filter('Musik',this)">🎵 Musik</button>
  <button onclick="filter('Gaming',this)">🎮 Gaming</button>
</div>

<h3>🔥 Video Viral Hari Ini</h3>
<main id="videos"></main>

<nav>
  <a href="#">⌂<br>Home</a>
  <a href="#videos">🔥<br>Trending</a>
  <a href="#videos">▶<br>Video</a>
  <a href="#top">♡<br>Favorit</a>
</nav>

<script>
const data = [
 {title:"Video Viral Terbaru 🔥",cat:"Trending",views:"12,5 rb",
  url:""},
 {title:"Video Lucu Bikin Ngakak 😂",cat:"Lucu",views:"8,2 rb",
  url:""},
 {title:"Musik Populer Minggu Ini 🎵",cat:"Musik",views:"5,1 rb",
  url:""},
 {title:"Momen Gaming Seru 🎮",cat:"Gaming",views:"3,7 rb",
  url:""},
];

let category="Semua";

function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const list=data.filter(v=>
  (category==="Semua"||v.cat===category)&&
  v.title.toLowerCase().includes(q)
 );
 document.getElementById("videos").innerHTML=list.length?list.map((v,i)=>`
  <article class="video">
   <div class="cover">
    <video controls playsinline preload="none"
      ${v.url?`src="${v.url}"`:""}
      poster=""
      aria-label="${v.title}">
    </video>
    ${v.url?"":'<div class="play">▶</div>'}
   </div>
   <div class="info">
    <h4>${v.title}</h4>
    <p>${v.cat} · ${v.views} tayangan</p>
    <div class="actions">
     <button onclick="like(this)">♡ Suka</button>
     <button onclick="share('${v.title.replace(/'/g,"")}')">↗ Bagikan</button>
    </div>
   </div>
  </article>`).join(""):'<div class="empty">Video tidak ditemukan.</div>';
}

function filter(cat,el){
 category=cat;
 document.querySelectorAll(".categories button").forEach(b=>b.classList.remove("active"));
 el.classList.add("active");
 render();
}
function like(btn){
 btn.textContent=btn.textContent.includes("Suka")?"♥ Disukai":"♡ Suka";
}
function share(title){
 if(navigator.share){
  navigator.share({title:title,url:location.href});
 }else{
  prompt("Salin link website ini:",location.href);
 }
}
document.getElementById("search").addEventListener("input",render);
render();
</script>
</body>
</html>
