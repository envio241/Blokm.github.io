
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videy Video Player</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
    }

    h2 {
      text-align: center;
    }

    .video-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 6px;
      font-size: 16px;
    }

    input {
      border: 1px solid #444;
      background: #222;
      color: white;
    }

    button {
      border: none;
      background: #e50914;
      color: white;
      cursor: pointer;
    }

    #status {
      color: #ccc;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Videy Video Player</h2>

    <div class="video-box">
      <video id="videoPlayer" controls playsinline>
        Browser kamu tidak mendukung pemutar video.
      </video>
    </div>

    <input
      type="file"
      id="videoFile"
      accept="video/*">

    <button onclick="playVideo()">
      Putar Video dari Galeri
    </button>

    <p id="status">Pilih video dari galeri HP kamu.</p>
  </div>

  <script>
    let videoURL = null;

    function playVideo() {
      const fileInput = document.getElementById("videoFile");
      const player = document.getElementById("videoPlayer");
      const status = document.getElementById("status");
      const file = fileInput.files[0];

      if (!file) {
        alert("Silakan pilih video dari galeri terlebih dahulu.");
        return;
      }

      if (videoURL) {
        URL.revokeObjectURL(videoURL);
      }

      videoURL = URL.createObjectURL(file);
      player.src = videoURL;
      player.load();

      status.textContent = "Video dipilih: " + file.name;
      player.play().catch(() => {
        status.textContent =
          "Video siap. Tekan tombol Play untuk memutarnya.";
      });
    }
  </script>
</body>
</html>
