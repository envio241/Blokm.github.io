
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Viral</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      background: linear-gradient(135deg, #080b20, #512da8, #00bcd4);
    }
    main { padding: 24px; }
    h1 { font-size: clamp(36px, 8vw, 64px); }
    p { font-size: 18px; }
    a {
      display: inline-block;
      padding: 14px 24px;
      color: #080b20;
      background: #00ffae;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <h1>🚀 Halo, Dunia!</h1>
    <p>Website pertamaku dibuat dengan GitHub Pages.</p>
    <a href="https://github.com/" target="_blank" rel="noopener">
      Explore GitHub
    </a>
  </main>
</body>
</html>
